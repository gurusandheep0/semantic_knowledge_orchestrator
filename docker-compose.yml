services:
  api:
    build: .
    command: python -m uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - prismrag-data:/app/data

  dashboard:
    build: .
    command: python -m streamlit run streamlit_app.py --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - prismrag-data:/app/data
    depends_on:
      - api

volumes:
  prismrag-data:
